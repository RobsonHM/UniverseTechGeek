<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sistema Comprometido | TechGeek</title>
    <link rel="stylesheet" href="../assets/css/homecustom.css">
    
    <style>
        
        :root {
            /* Usando o vermelho do seu tema para o efeito neon */
            --glow-color: #dc2626; 
            --bg-color: #000000;
            --text-color: #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* Impede scrollbar se o glitch for agressivo */
        }

        /* Container Principal centralizado */
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        /* --- Estilo do Número 404 Principal --- */
        .glitch-wrapper {
            position: relative;
            /* Tipografia pesada igual aos títulos dos seus álbuns */
            font-size: 10rem; 
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--text-color);
            text-transform: uppercase;
            /* Efeito Neon Sutil constante */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 
                         0 0 20px var(--glow-color), 
                         0 0 30px var(--glow-color);
            animation: glitch-skew 4s infinite linear alternate-reverse;
        }

        /* Criando as camadas para o efeito de corte (glitch) */
        .glitch-wrapper::before,
        .glitch-wrapper::after {
            content: "404";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        /* Camada Vermelha desandada */
        .glitch-wrapper::before {
            color: #ff0000;
            z-index: -1;
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
            text-shadow: -2px 0 red;
            clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
        }

        /* Camada Azul/Ciano desandada */
        .glitch-wrapper::after {
            color: #00ffff;
            z-index: -2;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
            text-shadow: 2px 0 blue;
            clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
        }

        /* --- Textos de Apoio --- */
        .error-title {
            font-size: 2rem;
            font-weight: 800;
            margin-top: -1.5rem; /* Puxa para cima para colar no 404 */
            text-transform: uppercase;
            letter-spacing: -0.04em;
            position: relative;
            display: inline-block;
        }

        /* Linha decorativa embaixo do título */
        .error-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background-color: var(--glow-color);
            border-radius: 2px;
        }

        .error-desc {
            color: var(--gray-500);
            max-width: 450px;
            margin: 2rem auto;
            line-height: 1.6;
        }

        /* --- Botão Customizado (Reutilizando seu estilo) --- */
        .btn-404 {
            /* Pega as classes que você já tem: btn-register */
            display: inline-block;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Efeito de brilho no hover do botão */
        .btn-404:hover {
            box-shadow: 0 0 15px var(--glow-color);
            transform: translateY(-2px);
        }

        /* --- DEFINIÇÃO DAS ANIMAÇÕES (KEYFRAMES) --- */
        
        /* Animação de tremor/distorção do 404 principal */
        @keyframes glitch-skew {
            0% { transform: skew(1deg); }
            10% { transform: skew(-2deg); }
            20% { transform: skew(3deg); }
            30% { transform: skew(-1deg); }
            40% { transform: skew(2deg); }
            50% { transform: skew(-3deg); }
            60% { transform: skew(1deg); }
            70% { transform: skew(-2deg); }
            80% { transform: skew(3deg); }
            90% { transform: skew(-1deg); }
            100% { transform: skew(2deg); }
        }

        /* Animação de corte (clip-path) para a camada 1 */
        @keyframes glitch-anim {
            0% { clip-path: polygon(0 15%, 100% 15%, 100% 30%, 0 30%); }
            15% { clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%); }
            30% { clip-path: polygon(0 5%, 100% 5%, 100% 10%, 0 10%); }
            45% { clip-path: polygon(0 80%, 100% 80%, 100% 90%, 0 90%); }
            60% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); }
            75% { clip-path: polygon(0 40%, 100% 40%, 100% 55%, 0 55%); }
            90% { clip-path: polygon(0 90%, 100% 90%, 100% 100%, 0 100%); }
            100% { clip-path: polygon(0 0%, 100% 0%, 100% 0%, 0% 0%); } /* Esconde no final */
        }

        /* Animação de corte (clip-path) para a camada 2 */
        @keyframes glitch-anim-2 {
            0% { clip-path: polygon(0 30%, 100% 30%, 100% 45%, 0 45%); }
            20% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); }
            40% { clip-path: polygon(0 70%, 100% 70%, 100% 85%, 0 85%); }
            60% { clip-path: polygon(0 5%, 100% 5%, 100% 10%, 0 10%); }
            80% { clip-path: polygon(0 90%, 100% 90%, 100% 100%, 0 100%); }
            100% { clip-path: polygon(0 40%, 100% 40%, 100% 55%, 0 55%); }
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .glitch-wrapper { font-size: 6rem; }
            .error-title { font-size: 1.5rem; margin-top: -1rem; }
        }

    </style>
</head>
<body>

    <main class="error-container container mx-auto px-4 flex flex-col items-center justify-center min-h-screen text-center">
        
        <div class="glitch-wrapper" data-text="404">
            404
        </div>

        <div class="space-y-4">
            <h1 class="error-title text-white uppercase font-extrabold tracking-tighter">
                System <span class="text-blue-600">corrupted</span>
            </h1>
            
            <p class="error-desc text-gray-500 text-lg leading-relaxed max-w-lg mx-auto">
                The requested route is unresponsive. The record appears to be corrupted or never existed in our database.
            </p>
            
            <div class="mt-12 flex gap-4 justify-center items-center">
                <a href="../home.html" class="btn-register btn-404 font-bold uppercase tracking-widest text-sm py-3 px-8 rounded-lg shadow-lg">
                    Abort and Return to Home
                </a>
            </div>
        </div>

    </main>

</body>
</html>
