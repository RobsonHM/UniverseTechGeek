<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Mídia - Universe TechGeek</title>
    <link rel="stylesheet" href="../assets/css/HomeCustom.css">
</head>
<body class="bg-white font-sans text-gray-900">

    <header class="border-b border-gray-200 py-6">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between ">
            <a href="../home.html" class="text-2xl font-extrabold font-bold button-transparent uppercase">universe Tech<span class="text-blue-600">Geek</span></a>
            
            <nav class="hidden md:flex font-medium text-sm uppercase tracking-wide">
                <a href="books.html" class="text-sm font-bold button-transparent ">Books</a>
                <a href="games.html" class="text-sm font-bold button-transparent ">Games</a>
                <a href="movies.html" class="text-sm font-bold button-transparent ">Movies</a>
                <a href="music.html" class="text-sm font-bold button-transparent ">Music</a>
                <a href="tv.html" class="text-sm font-bold button-transparent ">TV Shows</a>
            </nav>

            <div class="flex items-center space-x-4">
                <div class="w-7 h-7 rounded-full bg-gray-200 wireframe-box text-xs flex items-center justify-center">U</div>
            </div>
        </div>
    </header>

    <main class="container mx-auto py-12 px-4">
        
        <div class="book-container">
            <div class="book-cover wireframe-box shadow-2xl" id="media-poster-container">
                <span class="text-xl font-bold uppercase text-center p-4">Carregando...</span>
            </div>

            <div class="space-y-6">
                <div class="flex items-start justify-between flex-wrap gap-4">
                    <div>
                        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tighter" id="media-title">Título</h1>
                        <p class="text-xl text-blue-600 font-bold mt-2" id="media-creator">Diretor</p>
                    </div>
                    <div class="rating-badge text-white" id="media-rating">-</div>
                </div>
                
                <p class="text-gray-600 text-lg leading-relaxed" id="media-synopsis">
                    Sinopse...
                </p>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-x-12 info-grid py-12">
                    <div class="info-grid-item">
                        <span class="text-gray-500">Ano</span>
                        <span class="font-bold" id="info-year">-</span>
                    </div>
                    <div class="info-grid-item">
                        <span class="text-gray-500">Gênero</span>
                        <span class="font-bold" id="info-genre">-</span>
                    </div>
                    <div class="info-grid-item">
                        <span class="text-gray-500" id="label-duration">Duração</span>
                        <span class="font-bold" id="info-duration">-</span>
                    </div>
                    <div class="info-grid-item col-span-1 md:col-span-2">
                        <span class="text-gray-500">Elenco</span>
                        <span class="font-bold" id="info-cast">-</span>
                    </div>
                    <div class="info-grid-item col-span-1 md:col-span-2">
                        <a href="#" id="trailer-link" class="text-blue-600 hover:underline font-bold">Assistir Trailer</a>
                    </div>
                </div>
            </div>
        </div>

        <div id="container-review-global"></div>
        
    </main>

    <footer class="bg-gray-100 mt-20 border-t border-gray-200 text-center py-6">
        <p class="text-gray-500 text-sm">© 2026 Universe TechGeek.</p>
    </footer>

    <script src="../JS/movies_series.js"></script>
    <script src="../JS/review.js"></script>
</body>
</html>
