<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Details - Universe TechGeek</title>

    <link rel="stylesheet" href="../assets/css/HomeCustom.css">
</head>

<body class="bg-white font-sans text-gray-900">

<!-- HEADER -->

<header class="border-b border-gray-200 py-6">
    <div class="container mx-auto px-4 h-16 flex items-center justify-between">

        <a href="../home.html" class="text-2xl font-extrabold uppercase">
            universe Tech<span class="text-blue-600">Geek</span>
        </a>

        <nav class="hidden md:flex font-medium text-sm uppercase tracking-wide">

            <a href="books.html" class="button-transparent">Books</a>
            <a href="games.html" class="button-transparent">Games</a>
            <a href="movies_series.html" class="button-transparent">Movies</a>
            <a href="music.html" class="button-transparent">Music</a>
            <a href="tv.html" class="button-transparent">TV Shows</a>

        </nav>

        <div class="flex items-center space-x-4">

            <div class="w-7 h-7 rounded-full bg-gray-200 flex items-center justify-center text-xs">
                U
            </div>

            <button class="md:hidden p-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>

        </div>

    </div>
</header>

<!-- MAIN -->

<main class="container mx-auto py-12 px-4">

<div class="book-container">

<!-- POSTER -->

<div id="book-cover-container" class="book-cover shadow-2xl">

<img id="book-cover" src="" alt="cover" class="w-full h-full object-cover rounded-lg">

</div>


<!-- MAIN INFO -->

<div class="space-y-6">

<div class="flex items-start justify-between flex-wrap gap-4">

<div>

<h1 id="book-title" class="text-4xl md:text-5xl font-extrabold tracking-tighter">
Loading...
</h1>

<p id="book-author" class="text-xl text-blue-600 font-bold mt-2">
Loading...
</p>

</div>

<div id="book-rating" class="rating-badge text-white">
-
</div>

</div>


<p id="book-short-description" class="text-gray-600 text-lg leading-relaxed">
Loading description...
</p>



<!-- INFO GRID -->

<div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 info-grid py-12">

<div class="info-grid-item">
<span class="text-gray-500">Publisher</span>
<span id="info-publisher" class="font-bold">-</span>
</div>

<div class="info-grid-item">
<span class="text-gray-500">Language</span>
<span id="info-language" class="font-bold">-</span>
</div>

<div class="info-grid-item">
<span class="text-gray-500">Release Date</span>
<span id="info-date" class="font-bold">-</span>
</div>

<div class="info-grid-item">
<span class="text-gray-500">Pages</span>
<span id="info-pages" class="font-bold">-</span>
</div>

<div class="info-grid-item">
<span class="text-gray-500">Genre</span>
<span id="genre-tags" class="font-bold">-</span>
</div>

</div>

</div>

</div>


<!-- EXTRA DETAILS -->

<div class="grid grid-cols-1 lg:grid-cols-3 gap-12 mt-20 py-13">

<div>

<div class="spec-card space-y-4">

<div class="text-sm">
<p class="text-gray-500 uppercase font-bold text-xs mb-1">ISBN-13</p>
<p id="spec-isbn" class="font-bold">-</p>
</div>

<div class="text-sm">
<p class="text-gray-500 uppercase font-bold text-xs mb-1">Dimensions</p>
<p id="spec-dimensions" class="font-bold">-</p>
</div>

<div class="text-sm">
<p class="text-gray-500 uppercase font-bold text-xs mb-1">Format</p>
<p id="spec-format" class="font-bold">-</p>
</div>

<div class="text-sm">
<p class="text-gray-500 uppercase font-bold text-xs mb-1">Weight</p>
<p id="spec-weight" class="font-bold">-</p>
</div>

</div>

</div>

</div>


<!-- REVIEWS -->

<div id="container-review-global"></div>

</main>


<!-- FOOTER -->

<footer class="bg-gray-100 mt-20 border-t border-gray-200 text-center">

<div class="container mx-auto px-4 py-6">

<p class="text-gray-500 text-sm">
© 2026 Universe TechGeek. All rights reserved.
</p>

</div>

</footer>


<!-- JS -->

<script src="../JS/movies_series.js"></script>
<script src="../JS/review.js"></script>

</body>
</html>
