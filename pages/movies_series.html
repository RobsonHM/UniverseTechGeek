<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe Tech Geek - Movies & TV Shows</title>
    <link rel="stylesheet" href="../assets/css/HomeCustom.css">

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicons/apple-touch-icon.png">    
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicons/favicon-32x32.png">    
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicons/favicon-16x16.png">    
    <link rel="manifest" href="../assets/img/favicons/site.webmanifest">
</head>
<body class="antialiased">

    <header class="border-b border-gray-200 py-6">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between ">
            <a href="../home.html" class="text-2xl font-extrabold font-bold button-transparent uppercase">universe Tech<span class="text-blue-600">Geek</span></a>
            
            <nav class="hidden md:flex font-medium text-sm uppercase tracking-wide">
                <a href="books.html" class="text-sm font-bold button-transparent ">Books</a>
                <a href="games.html" class="text-sm font-bold button-transparent ">Games</a>
                <a href="movies_series.html" class="text-sm font-bold button-transparent ">Movies & TV shows</a>
                <a href="music.html" class="text-sm font-bold button-transparent ">Music</a>
            </nav>

            <div class="flex items-center space-x-4">
                <div id="switch-in-out">
                    <a id="nav-login" href="register.html" class="btn-logout text-blue-600 font-semibold button-transparent hidden">Login</a>
                    
                    <button id="nav-logout" onclick="logout()" class="btn-logout text-blue-600 font-semibold button-transparent hidden">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-8 py-12">
        <!-- Navegação e Alternador de Abas -->

        <!-- SECÇÃO DE FILMES -->
        <div id="section-movies" class="content-section active">
            <div class="section-title-wrapper">
                <h2 class="text-3xl font-extrabold uppercase tracking-tighter">Movies <span class="text-blue-600">Premium</span></h2>
                <button id="tab-series" onclick="switchTab('series')" class=" text-blue-600 font-semibold button-transparent">TV Shows</button>
                <!-- tab-btn -->
            </div>
            
            <div class="container mx-auto px-8 py-12">
               <div class="media-grid" id="movies-grid"></div>
            </div>
        </div>

        <!-- SECÇÃO DE SÉRIES    -->
        <div id="section-series" class="content-section">
            <div class="section-title-wrapper">
                <h2 class="text-3xl font-extrabold uppercase tracking-tighter">TV Shows <span class="text-blue-600">Premium</span></h2>
                <button id="tab-movies" onclick="switchTab('movies')" class="text-blue-600 font-semibold button-transparent">Movies</button>
                <!-- tab-btn active -->
            </div>

            <div class="container mx-auto px-8 py-12">
                <div class="media-grid" id="series-grid"></div>
            </div>
        </div>


        <!-- Paginação -->
        <nav class="py-12 flex justify-center items-center space-x-4">
            <div class="w-10 h-10 wireframe-box rounded border-black bg-black text-white font-bold cursor-default">1</div>
            <div class="w-10 h-10 wireframe-box rounded cursor-pointer">2</div>
            <div class="w-10 h-10 wireframe-box rounded cursor-pointer">3</div>
        </nav>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-100 border-t border-gray-200 py-12">
        <div class="container mx-auto px-4 text-center">
            <p class="text-gray-500 text-xs font-mono uppercase tracking-widest">
                Media Hub // Catálogo Unificado // 2024
            </p>
        </div>
    </footer>

    <script src="../JS/movies_series.js"></script>
    <script src="../JS/auth.js"></script>

</body>
</html>
