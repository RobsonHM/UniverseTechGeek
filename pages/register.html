<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../assets/css/HomeCustom.css">

    <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/favicons/apple-touch-icon.png">    
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicons/favicon-32x32.png">    
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicons/favicon-16x16.png">    
    <link rel="manifest" href="../assets/img/favicons/site.webmanifest">
</head>
<body>

    <div class="register-container">
        <div class="register-header">
            <h2>UNIVERSE <span>TECHGEEK</span></h2>
            <p style="color: var(--gray-500); font-size: 13px; margin-top: 5px;">Create your user account</p>
        </div>

              <div class="msg msg-{{ category }}">

              </div>


        <form id="formCadastro">
            <div class="form-group">
                <label for="username">Nickname</label>
                <input type="text" id="username" placeholder="Ex: geek_master" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button onclick="NewUser()" type="button" class="btn-register">Complete Registration</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <a href="login.html" style="color: var(--gray-500); font-size: 12px; text-decoration: none;">
                Already have an account? <span style="color: var(--red-destaque); font-weight: bold;">Sign In</span>
            </a>
        </div>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="../home.html" style="color: var(--gray-500); font-size: 10px; text-decoration: none; text-transform: uppercase; letter-spacing: 1px;">
                &larr; Back to Home
            </a>
        </div>
    </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.6.2/sql-wasm.js"></script>
        <script src="../JS/database.js"></script>
        <script src="../JS/auth.js"></script>
        <script src="../JS/register.js"></script>
   

</body>
</html>
